<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rie Taylor - Profile</title>

  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.1.2/css/all.css">

  <style>
   body {
      background: linear-gradient(rgba(109, 110, 117, 0.75), rgba(109, 110, 117, 0.75)),
                  url('images/freya.png') no-repeat 10% center fixed,
                  url('images/Subject.png') no-repeat 88% center fixed;

      background-size: auto 60vh, auto 60vh;

      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding: 40px 0;
      margin: 0;
    }

    .container {
      width: 450px;
      margin: 0 auto;
    }

    .card-white {
      background: white;
      padding: 40px;
      margin-bottom: 15px;
      border-radius: 15px;
      box-shadow: 50 10px 30px rgba(0, 0, 0, 0.08);
    }

    .img-circle {
      border-radius: 80%;
      width: 250px;
      height: 250px;
      object-fit: cover;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .text-center {
      text-align: center;
    }

    .list-inline {
      list-style: none;
      padding-left: 0px;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }

    .list-inline > li {
      display: inline-block;
      padding: 0px 20px;
    }

    h1 {
      font-size: 38px;
      color: #333;
      margin: 10px 0 5px 0;
    }

    .job-title {
      font-size: 16px;
      color: #777;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }

    .description {
      font-size: 18px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-details {
      display: inline-block;
      background-color: #0b529d;
      color: white;
      padding: 12px 30px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.3s, transform 0.2s;
      box-shadow: 0 4px 12px rgba(74, 144, 226, 0.3);
    }

    .btn-details:hover {
      background-color: #0b5882;
      transform: translateY(-2px);
    }

    .list-inline a {
      color: #555;
      font-size: 24px;
      transition: color 0.3s;
    }

    .list-inline a.facebook:hover { color: #1877F2; }
    .list-inline a.linkedin:hover { color: #0A66C2; }
    .list-inline a.twitter:hover { color: #1DA1F2; }
  </style>
</head>
<body>

  <div class="container">
    <div class="card-white text-center">
      <img src="images/profile.png" alt="Rie Taylor" class="img-circle">

      <header>
        <h1>Rie Taylor</h1>


      <p class="description">
        💻Practicing coding! 🚀
      </p>

      <a href="mailto:your-email@example.com" class="btn-details">Contact Me</a>

      <ul class="list-inline">
        <li>
          <a href="#" target="_blank" class="facebook" aria-label="Facebook">
            <i class="fab fa-facebook-f"></i>
          </a>
        </li>
        <li>
          <a href="#" target="_blank" class="linkedin" aria-label="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
        </li>
        <li>
          <a href="#" target="_blank" class="twitter" aria-label="Twitter">
            <i class="fab fa-twitter"></i>
          </a>
        </li>
      </ul>
    </div>

    <div class="card-white">
      <h2 style="font-size: 25px; color: #333; margin-top: 0;">My Passion</h2>
      <p class="description" style="margin-bottom: 0;">
        I'm interested in coding!
      </p>
    </div>


     <div class="card-white">
      <h2 style="font-size: 25px; color: #333; margin-top: 0;">Favorite</h2>
      <p class="description" style="margin-bottom: 0;">
        Running, Traveling , hiking with my family     </p>
    </div>

    <div class="card-white">
      <h2 style="font-size: 25px; color: #333; margin-top: 0;">Family</h2>
      <p class="description" style="margin-bottom: 0;">
        I have a wonderful family! 👨👦👶🐶
      </p>
    </div>

    <div class="card-white">
      <h2 style="font-size: 25px; color: #333; margin-top: 0;">Songs</h2>
      <p class="description text-center" style="margin-bottom: 0;">
        When I'm ..
        <br>
        <a href="https://youtu.be/ZbZSe6N_BXs?si=yE8TxdU5wzp19g9p" target="_blank" class="song-link">🎵 Happy</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="https://youtu.be/vbvyNnw8Qjg?si=JIXIpfeqc43koKe3" target="_blank" class="song-link">🌱 Chill</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="https://youtu.be/FcoUvu0mGog?si=tpQfmemXzLi_Y2xZ" target="_blank" class="song-link">🌧️ Sad</a>&nbsp;&nbsp;&nbsp;&nbsp;
        <a href="https://youtu.be/v2AC41dglnM?si=fFyPMy_IlURMWagV" target="_blank" class="song-link">🔥 Angry</a>
      </p>
    </div>


  </div>
</body>
</html>
